# ShadowVault SOC lab forwarder. TCP provides ordered delivery inside the
# isolated lab. Use RELP/TLS and certificate validation for production.

module(load="imfile")

input(
    type="imfile"
    File="/var/log/audit/audit.log"
    Tag="shadowvault-audit:"
    Facility="local6"
    Severity="info"
    PersistStateInterval="100"
)

*.info action(
    type="omfwd"
    target="@SHADOWVAULT_LOG_HOST@"
    port="@SHADOWVAULT_LOG_PORT@"
    protocol="tcp"
    template="RSYSLOG_SyslogProtocol23Format"
    action.resumeRetryCount="-1"
    queue.type="LinkedList"
    queue.filename="shadowvault-forward"
    queue.saveOnShutdown="on"
)
